<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Mario Style</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div><span>WORLD</span> 1-1</div>
        <div><span>TIME</span> <span id="time">300</span></div>
        <div><span>COINS</span> <span id="coins">0</span></div>
      </div>
      <canvas id="game" width="960" height="540"></canvas>
      <div class="controls">
        <p>Déplacements : ← → / A D &nbsp; • &nbsp; Saut : ↑ / W / Espace</p>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
